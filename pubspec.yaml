name: audiobook_player
description: 源听（YuanTing）— 自定义书源驱动的听书聚合播放器
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # === 状态管理与路由 ===
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0

  # === 网络请求 ===
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # === HTML 解析（书源引擎核心） ===
  html: ^0.15.4
  csslib: ^1.0.0

  # === 字符集（GBK 站点书源需要） ===
  fast_gbk: ^1.0.0

  # === 音频播放 ===
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.12
  audio_service: ^0.18.13
  audio_session: ^0.1.19

  # === 本地数据库 ===
  sqflite: ^2.3.3
  path: ^1.9.0

  # === KV 存储（播放队列快照） ===
  # === 应用配置 ===
  shared_preferences: ^2.2.3

  # === 文件与路径管理 ===
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.0.3

  # === UI 增强 ===
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.1.1
  fluttertoast: ^8.2.6

  # === 工具 ===
  uuid: ^4.4.0
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.2.0
  google_fonts: ^8.2.1
  cryptography: ^2.9.0
  crypto: ^3.0.7
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/yuanting_logo.png
